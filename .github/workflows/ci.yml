name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}

jobs:
  # Engine-side model registry and planner. This is the one gate in the
  # acceptance ladder that needs NO hardware, which is why it is the one that
  # can live in CI. Every other gate ssh's into real machines with NVIDIA GPUs;
  # a GitHub runner has none.
  #
  # G_MODEL used to also run the ds4x forward-pass alignment, which needed numpy
  # for its reference vectors. That line is frozen (2026-08-14) and parked behind
  # IDLETOKEN_DS4X_GATE=1, and scripts/ds4x_ref.py is not published at all — so
  # the numpy install went with it. What still runs here is engine-agnostic:
  # registry + planner, the no-hardcode scan, and model identity on the wire.
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Acceptance gate G_MODEL (registry + planner)
        run: scripts/acceptance.sh --gate G_MODEL
      # G_MODEL already runs this, but it is worth its own red line in the log,
      # and it must actually run: the previous version built the dumper with a
      # target that does not produce it, then skipped itself when the binary was
      # missing — a check that could not fail, which is the one thing this repo
      # keeps promising not to ship.
      - name: Manifests match the compiled registry
        run: |
          mkdir -p build
          cc -Wall -Wextra -std=c99 -Iinclude src/common/model.c \
             src/tools/model_registry_dump.c -o build/model_registry_dump
          python3 scripts/model_manifest_check.py build/model_registry_dump

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: corepack enable && corepack prepare pnpm@11.2.2 --activate
      - working-directory: client
        run: pnpm install --frozen-lockfile
      - name: Type-check
        working-directory: client
        run: npx tsc --noEmit
      - name: Build frontend
        working-directory: client
        run: npx vite build

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Syntax errors have reached main several times and were only caught when
      # someone happened to run the script. `bash -n` costs nothing.
      - name: Shell syntax
        run: |
          fail=0
          for f in scripts/*.sh; do bash -n "$f" || { echo "  syntax: $f"; fail=1; }; done
          exit $fail
      - name: Python syntax
        run: python3 -m compileall -q scripts/*.py
