[package]
name = "idletoken-client"
version = "0.1.0"
description = "IdleToken desktop/mobile client"
authors = ["IdleToken"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon + image-png: the app has to keep serving after its window is closed
# (a cluster node is a background service, not a document editor), so the tray
# is the only remaining way back to it. image-png is what `Image::from_bytes`
# needs to decode the bundled icon.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
# Native open-file dialog for the open-model picker (WS-D1): picking a local
# GGUF needs a real filesystem path, which the webview's own file input does
# not expose. Same "three OS conventions we should not re-implement" reasoning
# as autostart.
tauri-plugin-dialog = "2"
# In-app update: check a signed release manifest, download, verify the
# signature, install, relaunch. The signature check is the reason to use the
# plugin rather than a hand-rolled downloader — an updater that installs
# whatever the endpoint served is a remote-code-execution channel, and minisign
# verification against a pubkey baked into the binary is exactly the part we
# must not get wrong ourselves.
tauri-plugin-updater = "2"
# "Launch at login" across the three platforms (registry Run key / .desktop
# autostart entry / LaunchAgent plist). Same reasoning: three OS conventions we
# would otherwise re-implement and get subtly wrong on one of them.
tauri-plugin-autostart = "2"
# Only for parsing the update feed URL into the `Url` the updater builder
# wants; it is already in the tree as a transitive dependency of tauri.
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Integrity gate for downloaded weights (weights.rs): curated manifests pin
# each GGUF's SHA-256 and the client refuses to promote or serve a file that
# does not match. A hash we implement ourselves is not evidence of anything,
# so the crate is justified despite the bundle-size constraint.
sha2 = "0.10"
# OS entropy for the roster's per-member tokens and the discovery beacon's
# session id/nonce (pairing.rs). It has to come from the operating system's
# CSPRNG: a token an attacker can predict is not a token, and the beacon's
# nonce is the thing that must not be a function of anything guessable. Already
# in the tree as a transitive dependency of tauri, so this costs no new code.
getrandom = "0.2"
# Backoff sleeps in the engine supervisor; tauri's async runtime is tokio.
tokio = { version = "1", features = ["time"] }
# Weight downloads (weights.rs). Why the client downloads them rather than the
# engine: the engine's HTTP client is a raw socket with **no TLS** (both
# idletoken_http.h and weights.c say so), and by design it only speaks on the
# LAN, whereas huggingface.co and its mirrors are HTTPS. So the choice was
# either to add an entire TLS stack to the engine, or to use the Rust ecosystem
# the client already has.
#
# rustls rather than native-tls: no OpenSSL dependency on Windows, one variable
# fewer in cross-compilation and packaging (bundle size is a hard constraint, see
# principle 10). blocking rather than async: the download logic is a straight
# line, and putting it in spawn_blocking reads better than spreading async
# through it (clear code beats peak performance).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[features]
# by default Tauri runs in production mode; `tauri dev` toggles custom-protocol
custom-protocol = ["tauri/custom-protocol"]
# Honour IDLETOKEN_UPDATE_URL / IDLETOKEN_UPDATE_PUBKEY in an optimized build
# (update.rs). Debug builds honour them anyway; this exists only for a release
# build the acceptance gate drives against a feed it signed itself. NEVER
# enable it for a build that ships: it makes the update trust root replaceable
# by anyone who can set the process environment. See update.rs A-P0-1.
updater-override = []
